name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret not set — Render was NOT deployed. See deploy/DEPLOY-FREE.md"
            exit 1
          fi
          curl -fsSL -X POST "$HOOK"
          echo "Render deploy triggered."
