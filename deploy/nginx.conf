# Example Nginx config — replace YOUR_DOMAIN
# Place in /etc/nginx/sites-available/blockblast
# Then: sudo ln -s /etc/nginx/sites-available/blockblast /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

upstream blockblast {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect to HTTPS (after certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://blockblast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

